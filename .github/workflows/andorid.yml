name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shim/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner ubuntu-latest dah ada Android SDK + NDK. Guna terus, tak perlu setup-android.
      - name: Sedia Android SDK & NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;35.0.0"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "Guna NDK sedia ada: $ANDROID_NDK_LATEST_HOME"
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            "$SDKM" --install "ndk;${NDK_VERSION}"
            echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Rust + target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependency npm
        run: npm install

      - name: Jana ikon & projek Android
        run: |
          npm run icons
          npx tauri android init --ci

      # Ada secret keystore -> APK release bertandatangan. Tiada -> APK debug (boleh install terus, untuk test).
      - name: Build APK (release, signed)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx tauri android build --apk
          APK_DIR=src-tauri/gen/android/app/build/outputs/apk/universal/release
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$APK_DIR/app-universal-release-unsigned.apk" aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out JM-Operations.apk aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build APK (debug)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          npx tauri android build --apk --debug
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk JM-Operations.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JM-Operations-android
          path: JM-Operations.apk
          if-no-files-found: error
